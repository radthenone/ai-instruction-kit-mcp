[project]
name = "guides-mcp"
version = "0.1.0"
description = "MCP server dostarczający modułowe instrukcje architektury do projektów"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "pyyaml>=6.0,<7",
]

[project.scripts]
guides-mcp = "guides.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `unittest discover -s tests` i pytest wkładają `tests/` na sys.path, więc suity
# mogą się nawzajem importować (test_shell_suites → test_bash_hook_launcher).
# Python robi to samo dla katalogu uruchamianego skryptu, stąd `scripts/`
# (install_shared_skills → render_agent_commands). Type checker musi widzieć te
# same import rooty co runtime.
[tool.ty.environment]
extra-paths = ["tests", "scripts"]

[tool.hatch.build.targets.wheel]
packages = ["src/guides"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.yaml" = "guides/_data/manifest.yaml"
"modules" = "guides/_data/modules"
"profiles" = "guides/_data/profiles"
"scripts/bootstrap-project.sh" = "guides/_data/scripts/bootstrap-project.sh"

[tool.hatch.build.targets.sdist]
include = [
    "manifest.yaml",
    "modules/**",
    "profiles/**",
    "scripts/bootstrap-project.sh",
    "src/**",
    "README.md",
]
