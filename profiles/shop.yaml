# Kategoria: sklep online (e-commerce)
#
# Capabilities: auth, files, payments | Domain: shop
# Szczegóły konkretnego produktu (jubiler, tokeny gier, porty) → .ai/project.md w repo aplikacji
# Powtarzalne warianty między sklepami (physical/digital…) → przyszłe --tag / facets (zob. README)

name: shop
language: pl

extends: profiles/_base.yaml

capabilities:
  - auth
  - files
  - payments

domains:
  - shop

decisions:
  database: postgres
  cache: redis
  queue: redis
  storage: s3
  tasks: celery
  auth: allauth
  search: postgres

patterns:
  - webhooks

bundles:
  backend:
    - capability:auth
    - capability:files
    - capability:payments
    - domain:shop
    - pattern:webhooks
  frontend:
    - capability:auth
    - capability:payments
    - capability:payments:expo-stripe
    - domain:shop
    - stack:expo-router:mobile-native
    - arch:platforms
  payments:
    - capability:payments
    - capability:payments:expo-stripe
  architecture:
    - arch:platforms
    - arch:ci-cd
