# olivin-app — profil projektu w instruction-kit
#
# Monorepo e-commerce: Django + DRF + Expo Router
# Capabilities: auth, files, payments | Domain: shop
#
# W repo olivin-app trzymaj tylko:
#   .ai/project.profile.yaml  → extends ten plik + overlays
#   .ai/project.md            → overlay (taski, Docker, porty)

name: olivin-app
language: pl

extends: profiles/_base.yaml

capabilities:
  - auth
  - files-storage
  - payments

domains:
  - shop

decisions:
  database: postgres
  cache: redis
  queue: redis
  storage: s3
  tasks: celery

bundles:
  backend:
    - capability:auth
    - capability:files-storage
    - capability:payments
    - domain:shop
  frontend:
    - capability:auth
    - capability:payments
    - capability:payments:expo-stripe
    - domain:shop
    - stack:expo-router:mobile-native
    - arch:platforms
  payments:
    - capability:payments
    - capability:payments:expo-stripe
  architecture:
    - arch:platforms
    - arch:ci-cd
