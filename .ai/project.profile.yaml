# Profil repo instruction-kit — puste Tiery (sam core + to, co dopisze include).
# Serwer MCP czyta go z `--workspace` (tu: root tego repo).

name: ai-instruction-kit-mcp
language: pl
clients: claude,codex,opencode,vscode,antigravity

backend: none
web: none
mobile: none

codegen: none

server:
  guard: auto

overlays:
  - .ai/project.md

agents:
  light: cleanup,git-check,git-commit,git-end,git-start,headless
  standard: create-skill,create-task,kit-project-begin,kit-project-edit,review-architecture,review-backend,review-bugbot,review-frontend,review-security,review-tests,review-ui,subagent-backend,subagent-frontend,teacher-agent,teacher-architecture,teacher-backend,teacher-frontend
  heavy: night-run,review-edge

models:
  claude:
    light: haiku
    standard: sonnet
    heavy: opus
    takeover: haiku
