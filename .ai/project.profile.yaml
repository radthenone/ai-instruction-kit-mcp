# Profil repo instruction-kit — puste Tiery (sam core + to, co dopisze include).
# Serwer MCP czyta go z `--workspace` (tu: root tego repo).

name: ai-instruction-kit-mcp
language: pl
clients: claude,codex,opencode,vscode,antigravity

backend: none
web: none
mobile: none

codegen: none
codegraph_clients: [claude, codex, antigravity, opencode]
integrations: [orca, coderabbit]

server:
  guard: auto

overlays:
  - .ai/project.md

agents:
  light: cleanup,git-check,git-commit,git-end,git-start,headless,issue-stats,pr-stats
  standard: create-skill,create-task,kit-project-begin,kit-project-edit,review-architecture,review-backend,review-bugbot,review-frontend,review-security,review-tests,review-ui,subagent-backend,subagent-frontend,teacher-agent,teacher-architecture,teacher-backend,teacher-frontend,night-run-ticket
  heavy: night-run,review-edge

models:
  claude:
    light: haiku
    standard: sonnet
    heavy: opus
    takeover: haiku

t3:
  targets:
    claude:
      light:
        providerInstanceId: claudeAgent
        model: claude-haiku-5-5
        options: [{ id: effort, value: low }]
      standard:
        providerInstanceId: claudeAgent
        model: claude-haiku-5-5
        options: [{ id: effort, value: max }]
      heavy:
        providerInstanceId: claudeAgent
        model: claude-opus-5-5
        options: [{ id: effort, value: medium }]

    antigravity:
      light:
        providerInstanceId: antigravity
        model: gemini-3.8-flash
        options: [{ id: thinking_level, value: low }]
      standard:
        providerInstanceId: antigravity
        model: gemini-3.8-flash
        options: [{ id: thinking_level, value: high }]
      heavy:
        providerInstanceId: antigravity
        model: claude-opus-4-6-thinking
        options: [{ id: thinking_level, value: high }]

    opencode:
      light:
        providerInstanceId: opencode
        model: opencode/glm-5.3-flash-free
        options: [{ id: variant, value: high }]
      standard:
        providerInstanceId: opencode
        model: opencode/deepseek-v4.1-flash-free
        options: [{ id: variant, value: high }]
      heavy:
        providerInstanceId: opencode
        model: opencode/deepseek-v4.1-flash-free
        options: [{ id: variant, value: high }]

worktree:
  copy:
    - .mcp.json
    - .vscode/mcp.json
    - .codex/config.toml
    - .agents/mcp_config.json
    - .agents/hooks.json
    - .agents/hooks
    - opencode.json
    - .ai/.kit-bootstrap.json
    - .ai/.kit-doctor.json
    - .env
    - .claude/settings.local.json
  # skille Codexa i Antigravity generowane przez reload: jedna kopia, zawsze aktualna
  link:
    - .agents/skills
  # .venv w roocie: kit sam robi nakładkę
  venv: auto