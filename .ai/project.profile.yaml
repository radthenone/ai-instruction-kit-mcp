# Profil repo instruction-kit — puste Tiery (sam core + to, co dopisze include).
# Serwer MCP czyta go z `--workspace` (tu: root tego repo).

name: ai-instruction-kit-mcp
language: pl
clients: claude,codex,opencode,vscode,antigravity

backend: none
web: none
mobile: none

codegen: none
codegraph_clients: [claude, codex, antigravity, opencode]
integrations: [orca, coderabbit, t3code]

server:
  guard: auto

overlays:
  - .ai/project.md

agents:
  light: cleanup,git-check,git-commit,git-end,git-start,headless,issue-stats,pr-stats
  standard: create-skill,create-task,kit-project-begin,kit-project-edit,night-run,night-run-ticket,subagent-backend,subagent-frontend,teacher-agent,teacher-architecture,teacher-backend,teacher-frontend,review-council
  heavy: review-architecture,review-backend,review-bugbot,review-edge,review-frontend,review-security,review-tests,review-ui

night-run:
  clean-slate:
    provider: claudeAgent
    model: claude-opus-5-5
    effort: high

targets:
  claude:
    light:
      providerInstanceId: claudeAgent
      model: claude-haiku-5-5
      options: [{ id: effort, value: low }]
    standard:
      providerInstanceId: claudeAgent
      model: claude-haiku-5-5
      options: [{ id: effort, value: max }]
    heavy:
      providerInstanceId: claudeAgent
      model: claude-opus-5-5
      options: [{ id: effort, value: medium }]
    takeover:
      providerInstanceId: claudeAgent
      model: claude-haiku-5-5
      options: [{ id: effort, value: max }]
  codex:
    light:
      providerInstanceId: codex
      model: gpt-5.6-luna
      options: [{ id: reasoningEffort, value: low }]
    standard:
      providerInstanceId: codex
      model: gpt-6-luna
      options: [{ id: reasoningEffort, value: medium }]
    heavy:
      providerInstanceId: codex
      model: gpt-5.6-terra
      options: [{ id: reasoningEffort, value: high }]
    takeover:
      providerInstanceId: codex
      model: gpt-6-luna
      options: [{ id: reasoningEffort, value: medium }]
  antigravity:
    light:
      providerInstanceId: antigravity
      model: gemini-4-hydrogen
      options: [{ id: thought_level, value: low }]
    standard:
      providerInstanceId: antigravity
      model: gemini-4-hydrogen
      options: [{ id: thought_level, value: medium }]
    heavy:
      providerInstanceId: antigravity
      model: gemini-4-hydrogen
      options: [{ id: thought_level, value: high }]
    takeover:
      providerInstanceId: antigravity
      model: gemini-4-hydrogen
      options: [{ id: thought_level, value: high }]
  opencode:
    light:
      providerInstanceId: opencode
      model: opencode/deepseek-v4.1-flash-free
      options: [{ id: variant, value: high }]
    standard:
      providerInstanceId: opencode
      model: opencode/deepseek-v4.1-flash-free
      options: [{ id: variant, value: high }]
    heavy:
      providerInstanceId: opencode
      model: opencode/deepseek-v4.1-flash-free
      options: [{ id: variant, value: high }]
    takeover:
      providerInstanceId: opencode
      model: opencode/deepseek-v4.1-flash-free
      options: [{ id: variant, value: high }]

council:
  rounds: 2
  members:
    claude:
      target: claude.heavy
      supp-target: { providerInstanceId: claudeAgent, model: claude-opus-5-5, options: [{ id: effort, value: medium }] }
    opencode:
      target: opencode.heavy
      supp-target: { providerInstanceId: opencode, model: opencode/deepseek-v4.1-flash-free, options: [{ id: variant, value: high }] }
    antigravity:
      target: antigravity.heavy
      supp-target: { providerInstanceId: antigravity, model: gemini-4-hydrogen, options: [{ id: thought_level, value: high }] }

worktree:
  copy:
    - .mcp.json
    - .vscode/mcp.json
    - .codex/config.toml
    - .agents/mcp_config.json
    - .agents/hooks.json
    - .agents/hooks
    - opencode.json
    - .ai/.kit-bootstrap.json
    - .ai/.kit-doctor.json
    - .env
    - .claude/settings.local.json
  # skille Codexa i Antigravity generowane przez reload: jedna kopia, zawsze aktualna
  link:
    - .agents/skills
  # .venv w roocie: kit sam robi nakładkę
  venv: auto
