    - stack:expo-router:web-target
    - pattern:providers-and-settings

  infra:
    []

  devops:
    - arch:ci-cd

  full:
    - core:repo-first
    - core:language-pl
    - core:external-knowledge
    - core:workflow
    - core:typing-typescript
    - core:typing-python
    - arch:platforms
    - arch:monorepo-layout
    - arch:api-contract
    - arch:fe-be-separation
    - arch:ui-ux-expo
    - arch:ci-cd
    - stack:django-drf
    - stack:django-drf:structure
    - stack:django-drf:backend-standard
    - stack:django-drf:backend-instructions
    - stack:expo-router
    - stack:expo-router:structure
    - stack:expo-router:frontend-instructions
    - stack:expo-router:mobile-native
    - stack:expo-router:web-target
    - capability:auth
    - capability:files-storage
    - capability:payments
    - capability:payments:expo-stripe
