bundles:
  # Selektory wg tagów modułu + Tierów (zamiast sztywnych list — ADR-0001).
  # `full` bierze wszystko; `tags: ["*"]` = każdy moduł z profilu.
  backend:
    tiers: [backend]
    tags: [backend, capability]
    exclude_tags: [mobile]
  frontend:
    tiers: [web, mobile]
    tags: [frontend, mobile, web, capability]
  architecture:
    tiers: []
    tags: [architecture]
  infra:
    tiers: []
    tags: [infra]
  devops:
    tiers: []
    tags: [devops, infra]
  payments:
    tiers: []
    tags: [payments]
  full:
    tiers: [backend, web, mobile]
    tags: ["*"]

# ─── Mapowania: Profil → Module ID ──────────────────────
# ADR-0001: reguły włączania modułów żyją tutaj, nie w resolver.py.
# Dodanie nowej technologii = plik .md + wpis w `modules` + wpis niżej. Zero Pythona.
mappings:
  # Legacy `stacks:` z profilu (extends _base) — Tiery są w `tiers:` niżej.
  stacks:
    django-drf:
      - stack:django-drf
      - stack:django-drf:structure
      - stack:django-drf:backend-standard
      - stack:django-drf:backend-instructions
    expo-router:
      - stack:expo-router
      - stack:expo-router:structure
      - stack:expo-router:frontend-instructions

  # Tier → Stack → moduły. Klucz `none` = pusty Tier (brak klucza = none).
  # Nowy Stack (treść F) = pliki .md + wpisy tutaj. Zero Pythona.
  tiers:
    backend:
      django:
        - stack:django-drf
        - stack:django-drf:structure
        - stack:django-drf:backend-standard
        - stack:django-drf:backend-instructions
      django-html:
        - stack:django:layout
      fastapi:
        - stack:fastapi
        - stack:fastapi:structure
        - stack:fastapi:backend-instructions
        - stack:fastapi:testing
      flask:
        - stack:flask
        - stack:flask:structure
        - stack:flask:backend-instructions
        - stack:flask:testing
    # Moduły layoutu (`stack:frontend:*`) nie wchodzą do Bundli — są podpowiedzią
    # ścieżek w `layouts:` niżej (MCP `list_questions`).
    web:
      react:
        - stack:react
        - stack:react:modern
      react@legacy:
        - stack:react
        - stack:react:legacy
      angular:
        - stack:angular
        - stack:angular:modern
      angular@rxjs:
        - stack:angular
      expo:
        - stack:expo-router
        - stack:expo-router:structure
        - stack:expo-router:frontend-instructions
        - stack:expo-router:web-target
        - stack:expo-router:testing
    mobile:
      expo:
        - stack:expo-router
        - stack:expo-router:structure
        - stack:expo-router:frontend-instructions
        - stack:expo-router:mobile-native
        - stack:expo-router:testing
      react-native: []

  capabilities:
    auth: capability:auth
    files: capability:files
    payments: capability:payments

  domains: {}

  patterns:
    capability-provider: pattern:capability-provider
    capability-overview: pattern:capability-overview
    providers-and-settings: pattern:providers-and-settings
    gateway-nginx: pattern:gateway-nginx
    microservices-auth: pattern:microservices-auth
    webhooks: pattern:webhooks
    repo-first: core:repo-first

  # Slot → dozwolona Decyzja → moduł. Slot `auth` jest w `variants` (dokleja wariant
  # do modułu bazowego zamiast wnosić własny moduł infra).
  slots:
    database:
      postgres: infra:database:postgres
    cache:
      redis: infra:cache:redis
    queue:
      redis: infra:queue:redis
      rabbitmq: infra:queue:rabbitmq
    storage:
      s3: infra:storage:s3
      minio: infra:storage:s3
      aws: infra:storage:s3
    search:
      postgres: infra:search:postgres
      meilisearch: infra:search:meilisearch
    tasks:
      celery: infra:tasks:celery

  # Wariant: wstaw moduł zaraz po module bazowym.
  variants:
    auth:
      base: capability:auth
      default: custom
      values:
        allauth: capability:auth:allauth
        jwt: capability:auth:jwt
        custom: capability:auth:custom

  # Substytucja: podmień moduł bazowy na wariant.
  substitutions:
    codegen:
      base: arch:api-contract
      default: orval
      values:
        orval: arch:api-contract
        none: arch:api-contract:none
        graphql: arch:api-contract:graphql

  # Substytucja sterowana kluczem najwyższego poziomu profilu (`codegen:`),
  # Wariant — wartością ze `decisions:`. Moduły językowe scalają się do jednego.
  languages:
    default: pl
    values:
      pl: core:language-pl
      en: core:language-en

  # ADR-0003: Alias działa dalej, ale raportuje się w indeksie jako do migracji.
  # Dwie przestrzenie nazw, bo Alias Module ID i Alias nazwy Capability rozwiązują
  # się w innych momentach: `modules` przy normalizacji ID, `names` przy mapowaniu
  # sekcji profilu (capabilities / domains / patterns).
  aliases:
    modules:
      capability:files-storage: capability:files
    names:
      files-storage: files
      storage: files

# ─── Katalog pytań o projekt (MCP `list_questions`) ─────
# Skill (np. /kit-project-begin) czyta katalog, sprawdza `detect:` w plikach repo,
# pyta tylko o to, czego nie wykrył, i zapisuje odpowiedź tam, gdzie wskazuje `sets:`:
#   - klucz Profilu (`backend`, `web`, `mobile`, `codegen`),
#   - `paths.<tier>` → sekcja `## Ścieżki` w `.ai/project.md`,
#   - pytania tak/nie: `on_yes:` dopisuje do Profilu `include:` (Module ID) albo `patterns:`.
# `when:` — warunek na bieżącym Profilu: `all:` (każdy klucz pasuje) i `any:` (choć jeden).
# Wartość `"!none"` = Tier wybrany. `defaults:` — pierwsza pasująca nadpisuje `default`.
# `detect:` — `glob` (względem roota repo) + opcjonalny `pattern` (regex treści pliku);
# pierwszy pasujący sygnał daje `value`. Pytanie o Tier bez `options:` = Stacki
# z `mappings.tiers.<tier>` + `none`. Nowe pytanie = wpis tutaj, zero Pythona (ADR-0001).
questions:
  backend:
    question: Jaki Stack backendu?
    sets: backend
    default: none
    detect:
      - {glob: manage.py, value: django}
      - {glob: pyproject.toml, pattern: '(?i)\bdjango\b', value: django}
      - {glob: requirements*.txt, pattern: '(?im)^django\b', value: django}
      - {glob: pyproject.toml, pattern: '(?i)\bfastapi\b', value: fastapi}
      - {glob: requirements*.txt, pattern: '(?im)^fastapi\b', value: fastapi}
      - {glob: pyproject.toml, pattern: '(?i)\bflask\b', value: flask}
      - {glob: requirements*.txt, pattern: '(?im)^flask\b', value: flask}

  web:
    question: Jaki Stack web?
    sets: web
    default: react
    defaults:
      - when: {all: {backend: [django-html]}}
        value: none
    detect:
      - {glob: angular.json, value: angular}
      # Expo na web wymaga react-native-web; samo `expo` / `expo-router` ma też projekt tylko mobile.
      - {glob: "**/package.json", pattern: '(?s)(?=.*"expo"\s*:).*"react-native-web"\s*:', value: expo}
      # React web = react-dom; sam `react` ma też projekt React Native.
      - {glob: "**/package.json", pattern: '(?s)(?=.*"react-dom"\s*:).*"react"\s*:\s*"[\^~>=]*(1[6-8])\.', value: react@legacy}
      - {glob: "**/package.json", pattern: '"react-dom"\s*:', value: react}

  mobile:
    question: Jaki Stack mobile?
    sets: mobile
    default: none
    defaults:
      - when: {all: {backend: [django-html]}}
        value: none
    detect:
      # Expo tylko web też ma `expo` w app.json — mobile zdradza sekcja ios/android.
      - {glob: "**/app.json", pattern: '(?s)"expo"\s*:.*"(ios|android)"\s*:', value: expo}
      - {glob: "**/app.config.*", pattern: '\b(ios|android)\s*:', value: expo}
      # Projekt RN bez Expo ma natywne katalogi i nie ma `expo` w zależnościach.
      - {glob: "**/android/build.gradle", value: react-native}
      - {glob: "**/ios/Podfile", value: react-native}

  web-variant-react:
    question: Które podejście React — aktualne (19+) czy starsze (16–18)?
    sets: web
    options: [react, react@legacy]
    default: react
    when: {all: {web: [react, react@legacy]}}
    detect:
      - {glob: "**/package.json", pattern: '"react"\s*:\s*"[\^~>=]*(1[6-8])\.', value: react@legacy}

  web-variant-angular:
    question: Które podejście Angular — signals/standalone czy NgModule + RxJS?
    sets: web
    options: [angular, angular@rxjs]
    default: angular
    when: {all: {web: [angular, angular@rxjs]}}
    detect:
      - {glob: "src/**/*.module.ts", pattern: '@NgModule', value: angular@rxjs}

  codegen:
    question: Jak klient dostaje typy API?
    sets: codegen
    options: [orval, none, graphql]
    default: orval
    when:
      all: {backend: ["!none"]}
      any: {web: ["!none"], mobile: ["!none"]}
    detect:
      - {glob: "**/orval.config.*", value: orval}
      - {glob: "**/codegen.ts", pattern: '(?i)graphql', value: graphql}
      - {glob: "**/codegen.y*ml", pattern: '(?i)graphql', value: graphql}

  docker:
    question: Czy projekt działa w Dockerze?
    options: ["yes", "no"]
    default: "yes"
    on_yes: {include: [arch:docker-structure]}
    detect:
      - {glob: "**/Dockerfile", value: "yes"}
      - {glob: "docker-compose*.y*ml", value: "yes"}
      - {glob: "compose*.y*ml", value: "yes"}

  taskfile:
    question: Czy komendy idą przez Taskfile?
    options: ["yes", "no"]
    default: "yes"
    on_yes: {include: [arch:taskfile]}
    detect:
      - {glob: "Taskfile.y*ml", value: "yes"}

  ci-cd:
    question: Czy repo ma CI/CD?
    options: ["yes", "no"]
    default: "yes"
    on_yes: {include: [arch:ci-cd]}
    detect:
      - {glob: ".github/workflows/*.y*ml", value: "yes"}
      - {glob: ".gitlab-ci.yml", value: "yes"}

  monorepo:
    question: Czy backend i klient żyją w jednym repo?
    options: ["yes", "no"]
    default: "yes"
    when:
      all: {backend: ["!none"]}
      any: {web: ["!none"], mobile: ["!none"]}
    on_yes: {include: [arch:monorepo-layout, arch:fe-be-separation]}
    detect:
      - {glob: "frontend/package.json", value: "yes"}

  capability-provider:
    question: Czy integracje zewnętrzne (płatności, mail, storage) idą przez wzorzec capability + provider?
    options: ["yes", "no"]
    default: "no"
    when: {all: {backend: ["!none"]}}
    on_yes: {patterns: [capability-provider]}
    detect:
      - {glob: "**/providers/**/*.py", value: "yes"}

  webhooks:
    question: Czy backend przyjmuje webhooki?
    options: ["yes", "no"]
    default: "no"
    when: {all: {backend: ["!none"]}}
    on_yes: {patterns: [webhooks]}
    detect:
      - {glob: "**/*webhook*.py", value: "yes"}

  paths-backend:
    question: Gdzie leży kod backendu?
    sets: paths.backend
    default: backend/
    when: {all: {backend: ["!none"]}}

  paths-web:
    question: Gdzie leży kod web?
    sets: paths.web
    default: frontend/web/
    defaults:
      - when: {all: {web: [expo], mobile: [expo]}}
        value: frontend/
    when: {all: {web: ["!none"]}}

  paths-mobile:
    question: Gdzie leży kod mobile?
    sets: paths.mobile
    default: frontend/mobile/
    defaults:
      - when: {all: {web: [expo], mobile: [expo]}}
        value: frontend/
    when: {all: {mobile: ["!none"]}}

# Podpowiedzi układu katalogów (moduły layoutu spoza Bundli). `list_questions` pokazuje
# każdy pasujący wpis — warunki klienta (web/mobile) wzajemnie się wykluczają, backend
# ma własne. `warning:` zamiast `module:` = ostrzeżenie dla skilla.
layouts:
  - when: {all: {backend: [fastapi]}}
    module: stack:fastapi:layout
  - when: {all: {backend: [flask]}}
    module: stack:flask:layout
  - when: {all: {web: [expo], mobile: [react-native]}}
    warning: "web: expo + mobile: react-native — dwa toolchainy React Native w jednym repo. Rozważ mobile: expo (jeden projekt Expo) albo web: react."
  - when: {all: {web: [expo], mobile: [expo]}}
    module: stack:frontend:expo-unified
  - when: {all: {web: [expo], mobile: [none]}}
    module: stack:frontend:expo-web
  - when: {all: {web: [react, react@legacy], mobile: [expo]}}
    module: stack:frontend:react-expo-split
  - when: {all: {web: [react, react@legacy], mobile: [react-native]}}
    module: stack:frontend:react-native-split
  - when: {all: {web: [react, react@legacy], mobile: [none]}}
    module: stack:frontend:react-web
