# Profil projektu — jedyne miejsce konfiguracji kita (Tiery zamiast presetów).
# Jeden Tier = jeden Stack albo `none`. Puste Tiery = sam core.
# Wariant starszego podejścia: `react@legacy`, `angular@rxjs`.
# Po zmianie: `kit-ai reload` odświeża pliki kita (agenci, mcp.json, hooki).

name: my-project
language: pl
clients: all

backend: none
web: none
mobile: none

codegen: orval

# Klienci z sekcją CodeGraph w instrukcjach MCP (ADR-0012). Pusta lista = brak sekcji.
# Dopisz tylko klientów, którzy mają serwer codegraph, np. [claude, codex].
codegraph_clients: []

# Integracje z zewnętrznymi narzędziami (#459). Pusta lista = brak integracji.
# Dostępne na start: orca (orca.yaml), coderabbit (.coderabbit.yaml).
integrations: []

# Server guard (VPS) — twarda blokada ciężkich komend tylko na słabym hoście
# serwerowym (decyzja w runtime, normalnie nic nie ustawiasz). Brak sekcji
# = `guard: auto`, sama lista kita + rozwinięte wrappery. Po zmianie Taskfile
# albo `package.json` uruchom `kit-ai reload` (guard bez reloadu działa na starej
# liście wrapperów). Szczegóły: README „Server guard (VPS)”.
# server:
#   guard: auto        # auto (domyślnie) | off
#   deny:              # dodatki projektu, których automat nie wykryje
#     - "bunx eas-cli"
#   allow:             # wyjątki projektu (allow projektu > deny projektu > lista kita)
#     - "task lints:backend:ruff:check"

# Model per tier agenta (light / standard / heavy) i klient — README „Model tiers”.
# Bez tego bloku agenci jadą na modelu sesji. Blok `agents:` dopisuje reload.
# models:
#   claude:
#     light: haiku

# Git worktree (.ai/worktree.mjs) — konfiguracja Managed Worktree kita (ADR-0014).
# Worktree jest opcjonalny. Brak sekcji = domyślne kopiowanie plików maszynowych
# (konfiguracje MCP, .env itp.) i automatyczny overlay venv. Zapisz w Profilu tylko
# na życzenie użytkownika. Szczegóły: README „Git worktree (.ai/worktree.mjs)”.
# worktree:
#   # Dodatkowe pliki ignorowane przez git do skopiowania (poza .env i plikami MCP)
#   copy:
#     - ".env.local"
#   # Foldery lub pliki do symlinkowania (tylko do odczytu)
#   link:
#     - "data/"
#   # Komendy uruchamiane w worktree po copy/link
#   setup:
#     - "task build"
#   # Tryb venv: auto (overlay dla venv pythona) | overlay | none
#   venv: auto

overlays:
  - .ai/project.md
