# Codex CLI nie ma stałej zmiennej odpowiadającej ${workspaceFolder}.
# Użyj ścieżki absolutnej do workspace (katalog projektu aplikacji).
# Stack wybierasz w `.ai/project.profile.yaml` (Tiery backend/web/mobile).
# --clients: metadane (all | cursor | claude | …); bundle bez zmian — get_clients.

[mcp_servers.project-guides]
command = "uvx"
args = [
  "--from", "git+https://github.com/TWOJ_USER/ai-instruction-kit-mcp.git",
  "guides-mcp",
  "--language", "pl",
  "--clients", "all",
  "--workspace", "/ABSOLUTNA/SCIEZKA/DO/PROJEKTU",
]
