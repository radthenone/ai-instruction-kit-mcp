name: CI

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Unit tests
        run: uv run python -m unittest discover -s tests

      - name: Smoke FastMCP import (mcp 1.x pin)
        run: |
          uv run python -c "from mcp.server.fastmcp import FastMCP; import importlib.metadata as m; v=m.version('mcp'); assert v.startswith('1.'), v; print('mcp', v, 'OK')"
