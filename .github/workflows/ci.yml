name: CI

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      # Suity powłoki (tests/*.sh) i standalone tests/test_bash_hook_launcher.py wchodzą
      # tu przez tests/test_shell_suites.py — jeden seam, żadnej drugiej listy w YAML.
      # GitHub ustawia CI=true, więc brak basha jest błędem, nie cichym skipem.
      - name: Unit tests (+ suity powłoki)
        run: uv run python -m unittest discover -s tests

      # `tests/` jest importowalne w runtime (patrz [tool.ty.environment] w pyproject),
      # więc type checker musi biec z tą samą konfiguracją co IDE.
      - name: Typecheck
        run: uv tool run ty check

      - name: Smoke FastMCP import (mcp 1.x pin)
        run: |
          uv run python -c "from mcp.server.fastmcp import FastMCP; import importlib.metadata as m; v=m.version('mcp'); assert v.startswith('1.'), v; print('mcp', v, 'OK')"
