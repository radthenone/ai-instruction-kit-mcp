# Codex CLI nie ma stałej zmiennej odpowiadającej ${workspaceFolder}.
# Użyj ścieżki absolutnej do workspace (katalog projektu aplikacji).
# Wybierz kategorię z kita (`_base`, albo `shop` dla e-commerce).
# Lokalny .ai/project.profile.yaml tylko przy forku kategorii → wtedy --profile zamiast --preset.
# --clients: metadane (all | cursor | claude | …); bundle bez zmian — get_clients.

[mcp_servers.project-guides]
command = "uvx"
args = [
  "--from", "M:/projects/ai-instruction-kit-mcp",
  "guides-mcp",
  "--preset", "_base",
  "--language", "pl",
  "--codegen", "orval",
  "--clients", "claude,codex",
  "--workspace", "M:/projects/ai-instruction-kit-mcp",
]

[mcp_servers.project-guides.tools.get_overlay]
approval_mode = "approve"

[mcp_servers.project-guides.tools.get_module]
approval_mode = "approve"

[mcp_servers.project-guides.tools.check_kit_status]
approval_mode = "approve"
